services:
  # Django + gunicorn. Faqat 127.0.0.1:${WEB_PORT} da ochiladi —
  # tashqariga serverning o'z nginx'i chiqaradi (deploy/nginx-docker.conf).
  # Port band bo'lsa .env dagi WEB_PORT ni o'zgartiring.
  web:
    build: .
    container_name: ombor-crm
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data                 # sqlite bazasi
      - ./media:/app/media               # yuklangan rasm va hujjatlar
      - ./staticfiles:/app/staticfiles   # nginx shu papkadan static beradi
    ports:
      - "127.0.0.1:${WEB_PORT:-8089}:8000"

  # Serverda nginx bo'lmasa: docker compose --profile with-nginx up -d --build
  nginx:
    profiles:
      - with-nginx
    image: nginx:1.27-alpine
    container_name: ombor-crm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/var/www/static:ro
      - ./media:/var/www/media:ro
    depends_on:
      - web

  # 15-§A: shartnoma .docx'ini brauzerda tahrirlash (Collabora Online, WOPI).
  # Ixtiyoriy: docker compose --profile with-collabora up -d --build
  # Websocket (wss://) uchun tashqi reverse proxy (Caddy) ulanishi kerak —
  # bu docker-compose faqat konteynerni ko'taradi, domen/SSL alohida sozlanadi.
  collabora:
    profiles:
      - with-collabora
    image: collabora/code:latest
    container_name: ombor-crm-collabora
    restart: unless-stopped
    cap_add:
      - MKNOD
    env_file:
      - .env
    environment:
      # Faqat shu WOPI hostga (bizning backendimizga) ishonadi — .env dagi
      # WOPI_PUBLIC_URL bilan bir xil bo'lishi shart
      - aliasgroup1=${WOPI_PUBLIC_URL}
      - username=${COLLABORA_ADMIN_USER:-admin}
      - password=${COLLABORA_ADMIN_PASSWORD:-changeme}
      - DONT_GEN_SSL_CERT=set
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    ports:
      - "127.0.0.1:${COLLABORA_PORT:-9980}:9980"
