# /etc/nginx/sites-available/ombor-crm
# Docker'siz variant: gunicorn unix socket orqali ishlaydi (ombor-crm.service).

server {
    listen 80;
    server_name ombor.thesofmebel.uz;

    client_max_body_size 25m;

    location /static/ {
        alias /var/www/ombor-crm/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/ombor-crm/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://unix:/run/ombor-crm/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
