# /etc/nginx/sites-available/ombor.thesofmebel.uz
#
# Serverning O'Z nginx'i uchun: docker konteyneri 127.0.0.1:8000 da turadi.
# Bu variant thesofmebel.uz ning boshqa saytlariga tegmaydi.
#
#   sudo cp deploy/nginx-docker.conf /etc/nginx/sites-available/ombor.thesofmebel.uz
#   sudo ln -s /etc/nginx/sites-available/ombor.thesofmebel.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name ombor.thesofmebel.uz;

    # Mahsulot rasmi va ACT hujjatlari uchun
    client_max_body_size 25m;

    location /static/ {
        alias /var/www/ombor-crm/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/ombor-crm/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
