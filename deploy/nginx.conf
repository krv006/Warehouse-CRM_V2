# Docker ichidagi nginx — web konteyneriga proxy qiladi.

upstream ombor_crm {
    server web:8000;
}

server {
    listen 80;
    server_name ombor.thesofmebel.uz;

    # Mahsulot rasmi va ACT hujjatlari uchun
    client_max_body_size 25m;

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://ombor_crm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
